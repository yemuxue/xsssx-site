# Cloudflare Worker 静态资源配置
name = "xsssx-site"
compatibility_date = "2026-11-01"

# 自定义域名：deploy 时自动建 DNS 记录并签发证书
routes = [
  { pattern = "xsssxspace.com", custom_domain = true },
  { pattern = "www.xsssxspace.com", custom_domain = true }
]

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
